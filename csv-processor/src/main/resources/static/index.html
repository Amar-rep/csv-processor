<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSV Processor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="container">
    <header>
        <p class="eyebrow">CSV Processor</p>
        <h1>Upload and query CSV data</h1>
        <p class="subtitle">Upload a CSV, save the returned job ID, and retrieve its processed users.</p>
    </header>

    <section class="card">
        <h2>Upload CSV</h2>
        <form id="upload-form">
            <label class="file-picker">
                <span id="file-label">Choose a CSV file</span>
                <input id="csv-file" name="file" type="file" accept=".csv,text/csv" required>
            </label>
            <button type="submit">Upload file</button>
        </form>
        <p id="upload-status" class="status" aria-live="polite"></p>
    </section>

    <section class="card">
        <h2>Query job</h2>
        <form id="query-form" class="query-form">
            <label for="job-id">Job ID</label>
            <div class="input-row">
                <input id="job-id" type="text" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" required>
                <button type="submit">Fetch users</button>
            </div>
        </form>
        <p id="query-status" class="status" aria-live="polite"></p>
        <div class="table-wrap" hidden>
            <table>
                <thead>
                <tr><th>Name</th><th>Email</th><th>Phone</th><th>Website</th><th>Address</th></tr>
                </thead>
                <tbody id="results"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
    const uploadForm = document.querySelector('#upload-form');
    const queryForm = document.querySelector('#query-form');
    const fileInput = document.querySelector('#csv-file');
    const fileLabel = document.querySelector('#file-label');
    const jobIdInput = document.querySelector('#job-id');
    const uploadStatus = document.querySelector('#upload-status');
    const queryStatus = document.querySelector('#query-status');
    const results = document.querySelector('#results');
    const tableWrap = document.querySelector('.table-wrap');

    fileInput.addEventListener('change', () => {
        fileLabel.textContent = fileInput.files[0]?.name || 'Choose a CSV file';
    });

    uploadForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        uploadStatus.textContent = 'Uploading…';
        const data = new FormData();
        data.append('file', fileInput.files[0]);

        try {
            const response = await fetch('/csv/api/jobs', { method: 'POST', body: data });
            if (!response.ok) throw new Error(await response.text() || `Upload failed (${response.status})`);
            const jobId = (await response.text()).replaceAll('"', '').trim();
            jobIdInput.value = jobId;
            uploadStatus.textContent = `Uploaded successfully. Job ID: ${jobId}`;
        } catch (error) {
            uploadStatus.textContent = error.message;
        }
    });

    queryForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        queryStatus.textContent = 'Loading…';
        tableWrap.hidden = true;
        results.replaceChildren();

        try {
            const response = await fetch(`/csv/api/jobs/${encodeURIComponent(jobIdInput.value.trim())}`);
            if (!response.ok) throw new Error(await response.text() || `Query failed (${response.status})`);
            const users = await response.json();
            for (const user of users) {
                const row = document.createElement('tr');
                const address = user.address
                    ? [user.address.city, user.address.state, user.address.country, user.address.zipCode].filter(Boolean).join(', ')
                    : '—';
                for (const value of [
                    [user.firstName, user.lastName].filter(Boolean).join(' ') || '—',
                    user.email || '—',
                    [user.phoneNumber1, user.phoneNumber2].filter(Boolean).join(' / ') || '—',
                    user.websiteUrl || '—',
                    address
                ]) {
                    const cell = document.createElement('td');
                    cell.textContent = value;
                    row.appendChild(cell);
                }
                results.appendChild(row);
            }
            queryStatus.textContent = `${users.length} user${users.length === 1 ? '' : 's'} found.`;
            tableWrap.hidden = false;
        } catch (error) {
            queryStatus.textContent = error.message;
        }
    });
</script>
</body>
</html>
